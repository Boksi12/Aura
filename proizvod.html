<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Proizvod</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .product-page-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 5%;
        }

        .breadcrumbs {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .breadcrumbs span {
            color: var(--text-primary);
        }

        .breadcrumbs a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .breadcrumbs a:hover {
            color: var(--accent);
        }

        .product-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
        }

        .product-gallery {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .main-image {
            width: 100%;
            height: 600px;
            object-fit: contain;
            background-color: #fff;
            border-radius: 8px;
        }

        .thumbnails {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
        }

        .thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.7;
        }

        .thumb.active,
        .thumb:hover {
            border-color: var(--accent);
            opacity: 1;
        }

        /* Right Side Details */
        .product-details h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            color: #222;
        }

        .sku {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .price {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: #111;
        }

        .description-block {
            margin-bottom: 2rem;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 0;
            color: var(--text-secondary);
            line-height: 1.7;
            font-size: 0.95rem;
        }

        .description-block h4 {
            color: #111;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .options-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .select-box {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
            font-weight: 500;
        }

        .action-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .qty-input {
            width: 80px;
            display: flex;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            background: #fff;
        }

        .qty-input input {
            width: 40px;
            text-align: center;
            border: none;
            font-size: 1.1rem;
            outline: none;
            font-weight: 600;
        }

        .qty-controls {
            display: flex;
            flex-direction: column;
            width: 40px;
        }

        .qty-controls button {
            height: 50%;
            border: none;
            background: #111;
            color: #fff;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .qty-controls button:hover {
            background: #333;
        }

        .add-btn-large {
            flex-grow: 1;
            background: #fff;
            color: #111;
            border: 2px solid #ef4444;
            font-size: 1.25rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            border-radius: 4px;
            transition: var(--transition);
        }

        .add-btn-large:hover {
            background: #fef2f2;
        }

        .social-share {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .social-share span {
            color: var(--text-secondary);
            margin-right: 0.5rem;
            font-size: 0.9rem;
        }

        .social-btn {
            width: 35px;
            height: 35px;
            border: none;
            background: #f3f4f6;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-primary);
            transition: var(--transition);
        }

        .social-btn:hover {
            background: #e5e7eb;
        }

        @media (max-width: 900px) {
            .product-split {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">AURA</a></div>
        <nav class="nav-links">
            <a href="index.html">Početna</a>
            <a href="documentationAura.pdf" download>Dokumentacija</a>
            <a href="aura-projekat.zip" download>ZIP</a>
            <a href="author.html">Autor</a>
            <a href="kontakt.html">Kontakt</a>
        </nav>
        <div class="nav-right">
            <button class="cart-btn" id="cart-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="cart-badge">0</span>
            </button>
        </div>
    </header>

    <main class="product-page-container" id="product-container">
        <!-- Content injected by JS -->
        <h2 style="text-align: center; padding: 5rem;">Učitavanje proizvoda...</h2>
    </main>

    <!-- Shopping Cart Modal same as index -->
    <div class="cart-overlay" id="cart-overlay">
        <div class="cart-modal" id="cart-modal">
            <div class="cart-header">
                <h2>Tvoja Korpa</h2>
                <button class="close-cart" id="close-cart"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="cart-items" id="cart-items">
                <!-- Cart items will go here -->
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Ukupno:</span>
                    <span id="cart-total-price">0.00 RSD</span>
                </div>
                <button class="checkout-btn" onclick="window.location.href='checkout.html'">Završi kupovinu</button>
            </div>
        </div>
    </div>

    <script src="js/proizvod.js"></script>
</body>

</html>
